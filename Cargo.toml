[package]
name = "sonon"
version = "0.1.0"
edition = "2021"
authors = ["Aerovex Team"]
license = "MIT OR Apache-2.0"
description = "High-Performance Robotics-Aimed Acoustic DSP, Few-Shot Phrase Spotting & Streaming Audio Engine in Rust"
repository = "https://github.com/aerovexhq/sonon"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
