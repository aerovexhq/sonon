<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Subtle acoustic concentric rings -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#06b6d4" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#10b981" stroke-opacity="0.1" stroke-width="1"/>

  <!-- 7 Acoustic Frequency DSP Bars -->
  <g filter="url(#glow)">
    <rect x="9" y="25" width="4.5" height="14" rx="2.25" fill="#06b6d4"/>
    <rect x="16" y="18" width="4.5" height="28" rx="2.25" fill="#0891b2"/>
    <rect x="23" y="11" width="4.5" height="42" rx="2.25" fill="#06b6d4"/>
    <rect x="30" y="6" width="4.5" height="52" rx="2.25" fill="#22d3ee"/>
    <rect x="37" y="12" width="4.5" height="40" rx="2.25" fill="#14b8a6"/>
    <rect x="44" y="19" width="4.5" height="26" rx="2.25" fill="#10b981"/>
    <rect x="51" y="26" width="4.5" height="12" rx="2.25" fill="#34d399"/>
  </g>
</svg>